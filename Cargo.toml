[workspace]
resolver = "2"

members = [
    "modules/axalloc",
    "modules/axconfig",
    "modules/axdisplay",
    "modules/axdriver",
    "modules/axfs",
    "modules/axhal",
    "modules/axlog",
    "modules/axmm",
    "modules/axdma",
    "modules/axnet",
    "modules/axns",
    "modules/axruntime",
    "modules/axsync",
    "modules/axtask",
    "modules/axipi",
    "modules/axdriver_sg2002_sdio",
    "modules/axdriver_aic8800",
    "modules/axmodel_mushroom_yolov5",

    "api/axfeat",
    "api/arceos_api",
    "api/arceos_posix_api",

    "ulib/axstd",
    "ulib/axlibc",

    "examples/helloworld",
    "examples/helloworld-myplat",
    "examples/helloworld-licheerv-nano",
    "examples/plic-uart-licheerv-nano",
    "examples/sdio-enumerate-licheerv-nano",
    "examples/aic8800-init-licheerv-nano",
    "examples/aic8800-chip-id-licheerv-nano",
    "examples/aic8800-firmware-block-licheerv-nano",
    "examples/aic8800-firmware-boot-licheerv-nano",
    "examples/tpu-execute-licheerv-nano",
    "examples/mushroom-web-licheerv-nano",
    "examples/tpu-mmio-licheerv-nano",
    "examples/tpu-init-licheerv-nano",
    "examples/tpu-memory-licheerv-nano",
    "examples/tpu-dmabuf-licheerv-nano",
    "examples/httpclient",
    "examples/httpserver",
    "examples/shell",

    "platforms/axplat-riscv64-licheerv-nano",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Yuekai Jia <equation618@gmail.com>"]
license = "GPL-3.0-or-later OR Apache-2.0 OR MulanPSL-2.0"
homepage = "https://github.com/arceos-org/arceos"
documentation = "https://arceos-org.github.io/arceos"
repository = "https://github.com/arceos-org/arceos"
keywords = ["arceos", "kernel"]
categories = ["os", "no-std"]

[workspace.dependencies]
axstd = { path = "ulib/axstd" }
axlibc = { path = "ulib/axlibc" }

arceos_api = { path = "api/arceos_api" }
arceos_posix_api = { path = "api/arceos_posix_api" }
axfeat = { path = "api/axfeat" }

axalloc = { path = "modules/axalloc" }
axconfig = { path = "modules/axconfig" }
axdisplay = { path = "modules/axdisplay" }
axdriver = { path = "modules/axdriver" }
axfs = { path = "modules/axfs" }
axhal = { path = "modules/axhal" }
axlog = { path = "modules/axlog" }
axmm = { path = "modules/axmm" }
axnet = { path = "modules/axnet" }
axns = { path = "modules/axns" }
axruntime = { path = "modules/axruntime" }
axsync = { path = "modules/axsync" }
axtask = { path = "modules/axtask" }
axdma = { path = "modules/axdma" }
axipi = { path = "modules/axipi" }
axdriver_sg2002_sdio = { path = "modules/axdriver_sg2002_sdio" }
axdriver_aic8800 = { path = "modules/axdriver_aic8800" }
axmodel_mushroom_yolov5 = { path = "modules/axmodel_mushroom_yolov5" }

[profile.release]
lto = true
