[package]
name = "axplat-riscv64-licheerv-nano"
version = "0.1.0"
description = "ArceOS platform support for Sipeed LicheeRV Nano (SG2002)."
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
build = "build.rs"
autobins = false

[features]
fp-simd = ["axcpu/fp-simd"]
irq = ["axplat/irq"]

[dependencies]
axconfig-macros = "0.2"
axcpu = "0.3"
axplat = "0.4"
log = "0.4"
riscv = "0.16"
sbi-rt = { version = "0.0.3", features = ["legacy"] }

[package.metadata.docs.rs]
targets = ["riscv64gc-unknown-none-elf"]
